<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Happy 87th Birthday, Harry! | Harry's Boppers</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050510;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
        }

        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 18px 22px;
            border-radius: 12px;
            max-width: 420px;
            backdrop-filter: blur(4px);
        }
        #overlay h1 {
            font-size: 1.25em;
            color: #00d4aa;
            margin-bottom: 6px;
        }
        #overlay p {
            font-size: 0.85em;
            color: #ccc;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        #controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        button {
            background: #00d4aa;
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9em;
        }
        button:hover { background: #00ffcc; }
        button:disabled { background: #555; color: #aaa; cursor: not-allowed; }

        #seekBar {
            flex: 1;
            min-width: 120px;
            accent-color: #00d4aa;
        }

        #timeDisplay {
            font-family: monospace;
            font-size: 0.85em;
            color: #0f9;
            min-width: 80px;
            text-align: right;
        }

        #beatBar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(0,212,170,0.15);
            z-index: 100;
        }
        #beatMarker {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 4px;
            background: #00d4aa;
            box-shadow: 0 0 10px #00d4aa;
            transform: translateX(-50%);
        }
        #beatFlash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,212,170,0.25) 0%, transparent 70%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.05s ease-out;
            z-index: 50;
        }

        #credit {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #666;
            font-size: 0.8em;
            z-index: 100;
        }
        #credit a { color: #888; }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00d4aa;
            font-size: 1.2em;
            z-index: 200;
        }

        audio {
            width: 100%;
            margin-top: 10px;
            opacity: 0.85;
        }
    </style>
</head>

    <script>

        + '&nbsp;&nbsp;&nbsp;- Set <b>Block fingerprinting</b> to <b>Disabled</b> or <b>Standard</b> (not Strict).<br>'

        + '4. <a href="#" onclick="location.reload(true); return false;" style="color:#00d4aa;"><b>Reload this page</b></a>.<br><br>'

    function showFatal(msg, isWebGL) {
        const overlay = document.getElementById('overlay');
        const loading = document.getElementById('loading');
        if (overlay) {
            overlay.style.display = 'block';
            overlay.innerHTML = '<h1>' + msg + '</h1><p>' + (isWebGL ? WEBGL_INSTRUCTIONS : 'Please reload the page or try Chrome.') + '</p>';
        }
        if (loading) loading.style.display = 'none';
    }
    function isWebGLError(msg) {
        return /webgl/i.test(msg || '');
    }
    function formatTime(sec) {
        const s = Math.max(0, Math.floor(sec || 0));
        const m = Math.floor(s / 60);
        const rs = s % 60;
        return m + ':' + (rs < 10 ? '0' : '') + rs;
    }
    window.addEventListener('error', (e) => showFatal('Runtime error: ' + e.message, isWebGLError(e.message)));
    window.addEventListener('unhandledrejection', (e) => {
        const reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
        showFatal('Unhandled error: ' + reason, isWebGLError(reason));
    });

    // SoundfontPlayer: real instrument samples via Web Audio API
    class SoundfontPlayer {
        constructor(notesUrl) {
            this.notesUrl = notesUrl;
            this.notes = [];
            this.instruments = {};
            this.loaded = false;
            this.isPlaying = false;
            this.audioContext = null;
            this.startTime = 0;
            this.pauseTime = 0;
            this.duration = 38.5;
            this.scheduledUpTo = -1;
        }

        async init() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.audioContext = new AudioContext();
            const res = await fetch(this.notesUrl);
            const data = await res.json();
            this.notes = data.notes || [];
            this.duration = data.duration || 38.5;
            const uniqueInstruments = [...new Set(this.notes.map(n => n.instrument))];
            for (const inst of uniqueInstruments) {
                try {
                    this.instruments[inst] = await Soundfont.instrument(this.audioContext, inst, {
                        soundfont: 'FluidR3_GM',
                        format: 'mp3'
                    });
                } catch (err) {
                    console.warn('Could not load instrument', inst, err);
                }
            }
            this.loaded = true;
        }

        play() {
            if (!this.loaded || !this.audioContext) return;
            if (this.audioContext.state === 'suspended') {
                this.audioContext.resume();
            }
            this.isPlaying = true;
            this.startTime = this.audioContext.currentTime - this.pauseTime;
            this.scheduledUpTo = this.pauseTime;
        }

        pause() {
            this.isPlaying = false;
            this.pauseTime = this.currentTime;
            if (this.audioContext) {
                this.audioContext.suspend();
            }
        }

        seek(time) {
            this.pauseTime = Math.max(0, Math.min(this.duration, time));
            this.scheduledUpTo = this.pauseTime - 1;
            if (this.isPlaying) {
                this.startTime = this.audioContext.currentTime - this.pauseTime;
            }
        }

        get currentTime() {
            if (this.isPlaying && this.audioContext) {
                return this.audioContext.currentTime - this.startTime;
            }
            return this.pauseTime;
        }

        schedule() {
            if (!this.isPlaying || !this.loaded) return;
            const now = this.currentTime;
            const lookahead = 1.5;
            if (this.scheduledUpTo < now + lookahead) {
                const from = Math.max(now, this.scheduledUpTo);
                const to = now + lookahead;
                for (const note of this.notes) {
                    if (note.start >= from && note.start < to) {
                        const inst = this.instruments[note.instrument];
                        if (inst) {
                            const when = this.startTime + note.start;
                            inst.play(note.note, when, {
                                duration: note.duration,
                                gain: note.velocity * 0.8
                            });
                        }
                    }
                }
                this.scheduledUpTo = to;
            }
        }
    }

    (async function() {
        try {
        const scene = new BoppersScene({ cameraZ: 22, cameraY: 4, background: 0x0a0a20 });
        scene.scene.background = new THREE.Color(0x050510);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x4444ff, 0.7);
        scene.scene.add(hemiLight);
        const rimLight = new THREE.DirectionalLight(0x00d4aa, 0.9);
        rimLight.position.set(-10, 10, -10);
        scene.scene.add(rimLight);
        const fillLight = new THREE.PointLight(0xffaa55, 0.7, 80);
        fillLight.position.set(0, 14, 14);
        scene.scene.add(fillLight);

        const clock = new BoppersClock();
        let lastFrameTime = clock.now();

        // Audio: BoppersPlayer drives timing/analyzer; SoundfontPlayer provides real samples
        const audioEl = document.getElementById('boppersAudio');
        audioEl.volume = 0;
        audioEl.muted = true;
        const player = new BoppersPlayer('audio/happy-birthday-2026.mp3', { audioElement: audioEl });
        const analyzer = new BoppersAudioAnalyzer(player, { smoothing: 0.75 });
        const sfPlayer = new SoundfontPlayer('audio/happy-birthday-2026-notes.json');
        try {
            await sfPlayer.init();
        } catch (e) {
            console.warn('Could not init soundfont player', e);
        }
        let beatTimes = [];
        let nextBeatIndex = 0;
        try {
            const timing = await fetch('audio/happy-birthday-2026-timing.json').then(r => r.json());
            beatTimes = timing.beats || [];
        } catch (e) {
            console.warn('Could not load timing', e);
        }

        // Sound bars
        const BAR_COUNT = 16;
        const soundBars = [];
        const barGeo = new THREE.BoxGeometry(1.4, 1, 1.4);
        for (let i = 0; i < BAR_COUNT; i++) {
            const barMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(0.15 + (i / BAR_COUNT) * 0.35, 0.9, 0.5),
                transparent: true,
                opacity: 0.6
            });
            const bar = new THREE.Mesh(barGeo, barMat);
            bar.position.set(-28 + i * 3.6, -2, -34);
            scene.scene.add(bar);
            soundBars.push(bar);
        }

        // Letter tiles — cubes with letter textures
        const letters = [];

        function hexToRgb(hex) {
            const num = parseInt(hex.replace('#', ''), 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        }

        function isLightColor(hex) {
            const c = hexToRgb(hex);
            // Perceived luminance
            return (0.299 * c.r + 0.587 * c.g + 0.114 * c.b) > 160;
        }

        function createLetterTexture(char, color) {
            const size = 256;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            // Background
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, size, size);
            // Slight inner glow/shadow
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 8;
            ctx.strokeRect(8, 8, size - 16, size - 16);
            // Choose text color for contrast
            const lightBg = isLightColor(color);
            const textColor = lightBg ? '#1a1a1a' : '#ffffff';
            const shadowColor = lightBg ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.7)';
            // Strong outline/shadow for readability
            ctx.save();
            ctx.font = 'bold 160px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 16;
            ctx.strokeStyle = shadowColor;
            ctx.lineJoin = 'round';
            ctx.strokeText(char, size / 2, size / 2 + 10);
            ctx.fillStyle = textColor;
            ctx.fillText(char, size / 2, size / 2 + 10);
            ctx.restore();
            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            return tex;
        }

        function makeLetterTile(char, color, x, y, z, idx) {
            const size = 3.6;
            const geometry = new THREE.BoxGeometry(size, size, size);
            const tex = createLetterTexture(char, color);
            const sideMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: 0.4, metalness: 0.1 });
            const faceMat = new THREE.MeshStandardMaterial({
                map: tex,
                color: 0xffffff,
                roughness: 0.4,
                metalness: 0.1,
                emissive: new THREE.Color(color),
                emissiveIntensity: 0.3
            });
            // Box materials: right, left, top, bottom, front, back
            const materials = [sideMat, sideMat, sideMat, sideMat, faceMat, faceMat];
            const cube = new THREE.Mesh(geometry, materials);
            cube.position.set(x, y, z);
            cube.userData = {
                home: new THREE.Vector3(x, y, z),
                current: new THREE.Vector3(x, y, z),
                idx: idx,
                phase: idx * 0.3,
                state: 'home',
                carrier: null,
                storedIn: null
            };
            scene.root.add(cube);
            return cube;
        }

        function layoutWord(text, color, y, z) {
            const spacing = 4.2;
            const totalWidth = (text.length - 1) * spacing;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (ch === ' ') continue;
                const x = i * spacing - totalWidth / 2;
                const tile = makeLetterTile(ch, color, x, y, z, letters.length);
                letters.push(tile);
            }
        }

        layoutWord('HAPPY', '#00d4aa', 8, 0);
        layoutWord('87TH', '#ffd700', 4, 0);
        layoutWord('BIRTHDAY', '#e94560', 0, 0);
        layoutWord('HARRY', '#4285f4', -1, 0);

        // Ladders — stored in a visible rack on the platform edge
        const ladders = [];
        const LADDER_BOTTOM = -1;
        const LADDER_TOP = 8.5;
        const LADDER_STASH = { x: 25, z: 0 };
        const WORLD_RADIUS = 24;

        function makeLadder(x, z) {
            const group = new THREE.Group();
            const railGeo = new THREE.CylinderGeometry(0.06, 0.06, LADDER_TOP - LADDER_BOTTOM, 8);
            const railMat = new THREE.MeshStandardMaterial({ color: 0x8d6e63 });
            const leftRail = new THREE.Mesh(railGeo, railMat);
            leftRail.position.set(-0.35, (LADDER_TOP + LADDER_BOTTOM) / 2, 0);
            const rightRail = new THREE.Mesh(railGeo, railMat);
            rightRail.position.set(0.35, (LADDER_TOP + LADDER_BOTTOM) / 2, 0);
            group.add(leftRail);
            group.add(rightRail);
            const rungCount = Math.max(3, Math.floor((LADDER_TOP - LADDER_BOTTOM) / 0.5));
            const rungGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.7, 8);
            for (let i = 0; i < rungCount; i++) {
                const rung = new THREE.Mesh(rungGeo, railMat);
                rung.rotation.z = Math.PI / 2;
                rung.position.set(0, LADDER_BOTTOM + (i + 0.5) * ((LADDER_TOP - LADDER_BOTTOM) / rungCount), 0);
                group.add(rung);
            }
            group.position.set(LADDER_STASH.x, 0, LADDER_STASH.z);
            group.visible = false;
            scene.root.add(group);
            const ladder = { group, x, z, placed: false, carriedBy: null };
            ladders.push(ladder);
            return ladder;
        }

        // Create needed ladder slots near each column of high letters
        const highXs = new Set();
        letters.forEach(l => {
            if (l.userData.home.y >= 6) highXs.add(l.userData.home.x);
        });
        highXs.forEach(x => makeLadder(x, 2.5));

        // Visible ladder station/rack at the stash location
        function makeLadderRack() {
            const group = new THREE.Group();
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x8d6e63, roughness: 0.7 });
            // Base platform
            const baseGeo = new THREE.BoxGeometry(6, 0.4, 5);
            const base = new THREE.Mesh(baseGeo, frameMat);
            base.position.y = -1.1;
            group.add(base);
            // Vertical posts
            const postGeo = new THREE.BoxGeometry(0.25, 4.5, 0.25);
            for (let px of [-2.2, 2.2]) {
                for (let pz of [-1.8, 1.8]) {
                    const post = new THREE.Mesh(postGeo, frameMat);
                    post.position.set(px, 1.15, pz);
                    group.add(post);
                }
            }
            // Horizontal rails holding spare ladders
            const railGeo = new THREE.CylinderGeometry(0.1, 0.1, 4.4, 8);
            for (let ry of [0.2, 1.6, 3.0]) {
                const rail = new THREE.Mesh(railGeo, frameMat);
                rail.rotation.z = Math.PI / 2;
                rail.position.set(0, ry, -1.8);
                group.add(rail);
                const rail2 = new THREE.Mesh(railGeo, frameMat);
                rail2.rotation.z = Math.PI / 2;
                rail2.position.set(0, ry, 1.8);
                group.add(rail2);
            }
            // A few decorative spare ladders leaning on the rack
            const spareGeo = new THREE.CylinderGeometry(0.07, 0.07, 3.8, 8);
            const spareMat = new THREE.MeshStandardMaterial({ color: 0xa1887f });
            for (let i = 0; i < 4; i++) {
                const spare = new THREE.Mesh(spareGeo, spareMat);
                spare.position.set(-1.5 + i * 1.0, 1.6, 0);
                spare.rotation.z = 0.12 + Math.random() * 0.06;
                spare.rotation.y = (Math.random() - 0.5) * 0.2;
                group.add(spare);
            }
            // Glowing sign so the stash is impossible to miss
            const signGeo = new THREE.BoxGeometry(4.5, 1.0, 0.15);
            const signMat = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0x00d4aa, emissiveIntensity: 0.6 });
            const sign = new THREE.Mesh(signGeo, signMat);
            sign.position.set(0, 3.8, 1.9);
            group.add(sign);
            // Point light on the sign
            const rackLight = new THREE.PointLight(0x00d4aa, 0.8, 12);
            rackLight.position.set(0, 3.5, 0);
            group.add(rackLight);
            group.position.set(LADDER_STASH.x, 0, LADDER_STASH.z);
            scene.root.add(group);
            return group;
        }
        makeLadderRack();

        // Harry — bigger, recognizable older man with white hair and short white beard
        function makeHarry() {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xf5cda2, roughness: 0.6 });
            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.8 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x87ceeb, roughness: 0.7 });
            const pantMat = new THREE.MeshStandardMaterial({ color: 0x3e4a5e, roughness: 0.8 });
            const shoeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 });

            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.9, 1.0, 2.6, 16);
            const body = new THREE.Mesh(bodyGeo, shirtMat);
            body.position.y = 2.0;
            group.add(body);

            // Head
            const headGeo = new THREE.SphereGeometry(0.75, 24, 24);
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 3.7;
            group.add(head);

            // White hair (hemisphere on top)
            const hairGeo = new THREE.SphereGeometry(0.78, 24, 24, 0, Math.PI * 2, 0, Math.PI / 2.2);
            const hair = new THREE.Mesh(hairGeo, whiteMat);
            hair.position.y = 3.75;
            group.add(hair);

            // Side hair / ears cover
            for (const sx of [-0.62, 0.62]) {
                const sideGeo = new THREE.SphereGeometry(0.35, 16, 16);
                const sideHair = new THREE.Mesh(sideGeo, whiteMat);
                sideHair.position.set(sx, 3.7, -0.1);
                group.add(sideHair);
            }

            // White short beard
            const beardGeo = new THREE.ConeGeometry(0.6, 0.9, 24);
            const beard = new THREE.Mesh(beardGeo, whiteMat);
            beard.position.set(0, 3.15, 0.45);
            beard.rotation.x = Math.PI;
            group.add(beard);

            // Mustache
            const stacheGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.7, 8);
            const stache = new THREE.Mesh(stacheGeo, whiteMat);
            stache.rotation.z = Math.PI / 2;
            stache.position.set(0, 3.45, 0.68);
            group.add(stache);

            // Eyes
            const eyeGeo = new THREE.SphereGeometry(0.09, 12, 12);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            for (const ex of [-0.22, 0.22]) {
                const eye = new THREE.Mesh(eyeGeo, eyeMat);
                eye.position.set(ex, 3.8, 0.62);
                group.add(eye);
            }

            // Glasses
            const glassesGeo = new THREE.TorusGeometry(0.16, 0.025, 8, 16);
            const glassesMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.6, roughness: 0.3 });
            for (const gx of [-0.22, 0.22]) {
                const glass = new THREE.Mesh(glassesGeo, glassesMat);
                glass.position.set(gx, 3.8, 0.68);
                group.add(glass);
            }
            const bridgeGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.28, 8);
            const bridge = new THREE.Mesh(bridgeGeo, glassesMat);
            bridge.rotation.z = Math.PI / 2;
            bridge.position.set(0, 3.8, 0.68);
            group.add(bridge);

            // Arms
            const armGeo = new THREE.CylinderGeometry(0.22, 0.2, 1.6, 12);
            const leftArm = new THREE.Mesh(armGeo, shirtMat);
            leftArm.position.set(-1.05, 2.2, 0.2);
            leftArm.rotation.z = 0.35;
            leftArm.rotation.x = 0.3;
            group.add(leftArm);
            const rightArm = new THREE.Mesh(armGeo, shirtMat);
            rightArm.position.set(1.05, 2.2, 0.2);
            rightArm.rotation.z = -0.35;
            rightArm.rotation.x = 0.3;
            group.add(rightArm);

            // Hands
            const handGeo = new THREE.SphereGeometry(0.2, 12, 12);
            const leftHand = new THREE.Mesh(handGeo, skinMat);
            leftHand.position.set(-1.35, 1.55, 0.55);
            group.add(leftHand);
            const rightHand = new THREE.Mesh(handGeo, skinMat);
            rightHand.position.set(1.35, 1.55, 0.55);
            group.add(rightHand);

            // Boplist scroll
            const scrollGeo = new THREE.BoxGeometry(0.9, 1.3, 0.08);
            const scrollMat = new THREE.MeshStandardMaterial({ color: 0xfff8dc });
            const scroll = new THREE.Mesh(scrollGeo, scrollMat);

        makeHarry();

        function findUnplacedLadderNeed() {
            return ladders.find(l => !l.placed && !l.carriedBy && l.group && !l.group.visible);
        }

        function nearestLadderToTile(tile) {
            let best = null;
            let bestD = Infinity;
            ladders.forEach(l => {
                if (!l.placed) return;
                const d = Math.abs(l.x - tile.userData.home.x) + Math.abs(l.z - tile.userData.home.z);
                if (d < bestD) {
                    bestD = d;
                    best = l;
                }
            });
            return best;
        }

        // Confetti
        const confetti = [];

        const colors = [0x00d4aa, 0xe94560, 0xfbbc04, 0x4285f4, 0x9c27b0];

        for (let i = 0; i < 120; i++) spawnConfetti();

        // Floor glow ring

        // Beat rings pool

        const ringPool = [];
        function spawnBeatRing(x, z, color) {

        // Burrows — real holes that things sink into
        const burrows = [];

        function makeBurrow(x, z, idx) {
            const group = new THREE.Group();
            const depth = 8.0;
            const radius = 2.6;

            // Tall dirt cylinder: rises above the platform so it's impossible to miss
            const cylinderHeight = depth + 2.5;
            const cylinderGeo = new THREE.CylinderGeometry(radius, radius * 0.8, cylinderHeight, 32, 1, true);
            const cylinderMat = new THREE.MeshStandardMaterial({
                color: 0xc69c6d,

                side: THREE.DoubleSide,

            });
            const cylinder = new THREE.Mesh(cylinderGeo, cylinderMat);
            cylinder.position.y = -1.0 - depth / 2;

            // Bright rim ring at platform level
            const glowGeo = new THREE.RingGeometry(radius - 0.05, radius + 0.15, 32);
            const glowMat = new THREE.MeshBasicMaterial({ color: 0xffd54f, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            glow.rotation.x = -Math.PI / 2;
            glow.position.y = -0.95;
            group.add(glow);

            // Dark bottom cap
            const capGeo = new THREE.CircleGeometry(radius * 0.8, 32);
            const capMat = new THREE.MeshBasicMaterial({ color: 0x1a1008 });
            const cap = new THREE.Mesh(capGeo, capMat);
            cap.rotation.x = Math.PI / 2;
            cap.position.y = -1.0 - depth;
            group.add(cap);

            // Dirt rim around the hole
            const rimGeo = new THREE.RingGeometry(radius, radius + 0.9, 32);
            const rimMat = new THREE.MeshBasicMaterial({ color: 0xc69c6d, side: THREE.DoubleSide });
            const rim = new THREE.Mesh(rimGeo, rimMat);
            rim.rotation.x = -Math.PI / 2;
            rim.position.y = -1.0;
            rim.scale.set(0, 0, 0);
            group.add(rim);

            // Raised mound around rim
            const moundGeo = new THREE.TorusGeometry(radius + 0.55, 0.3, 8, 32);
            const moundMat = new THREE.MeshStandardMaterial({ color: 0xa1887f, roughness: 1.0 });
            const mound = new THREE.Mesh(moundGeo, moundMat);
            mound.rotation.x = -Math.PI / 2;
            mound.position.y = -1.0;
            mound.scale.set(0, 0, 0);
            group.add(mound);

            group.position.set(x, 0, z);
            scene.root.add(group);

            const burrow = {
                group, cylinder, glow, rim, mound, cap,
                x, z,
                radius,
                depth,
                dug: false,
                stored: [],
                opening: null,
                idx,
                maxCubes: 4,
                isFull() { return this.stored.length >= this.maxCubes; }
            };
            burrows.push(burrow);
            return burrow;
        }

        // Wombat class
        class Wombat {
            constructor(sceneRoot, geometry, baseScale, color, idx) {
                this.idx = idx;
                this.color = color;
                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    roughness: 0.95,
                    metalness: 0.05
                });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.scale.set(baseScale, baseScale, baseScale);
                this.mesh.position.set(0, -0.7, 4);
                this.mesh.rotation.x = -Math.PI / 2;
                sceneRoot.add(this.mesh);

                this.position = this.mesh.position;
                this.facingAngle = Math.random() * Math.PI * 2;
                this.state = 'wander';
                this.stateTimer = 0;
                this.target = new THREE.Vector3();
                this.carrying = null;
                this.burrow = null;
                this.homeBurrow = null;
                this.digSpot = null;
                this.ladder = null;
                this.ladderToPlace = null;
                this.ladderTargetX = 0;
                this.ladderTargetZ = 0;
                this.dancePhase = Math.random() * Math.PI * 2;
                this.speed = 2.5 + Math.random() * 1.5;
                this.turnSpeed = 4.0;
                this.bobOffset = Math.random() * Math.PI;
                this.stuckTime = 0;
                this.lastPos = this.position.clone();
                this.pickNewTarget();
            }

            pickNewTarget() {
                // Stay near the center/burrows; never wander to the world edge
                const angle = Math.random() * Math.PI * 2;
                const radius = 2 + Math.random() * 6;
                this.target.set(Math.cos(angle) * radius, -0.7, Math.sin(angle) * radius);
            }

            resetToWork() {
                // Force the wombat back into the central work area and pick real work
                this.ladderToPlace = null;
                this.ladder = null;
                this.carrying = null;
                this.pickNewTarget();
                this.setState('wander', 2);
            }

            nearestHomeTile(requireHigh) {
                let best = null;
                let bestD = Infinity;
                letters.forEach(tile => {
                    if (tile.userData.state !== 'home') return;
                    if (requireHigh && tile.userData.home.y < 3) return;
                    if (!requireHigh && tile.userData.home.y >= 3) return;
                    const d = tile.position.distanceTo(this.position);
                    if (d < bestD && d < 25) {
                        bestD = d;
                        best = tile;
                    }
                });
                return best;
            }



            setState(newState, duration) {
                this.state = newState;
                this.stateTimer = duration || (2 + Math.random() * 2);
            }

            faceTarget(target, dt) {
                const dx = target.x - this.position.x;
                const dz = target.z - this.position.z;
                const targetAngle = Math.atan2(dx, dz);
                let diff = targetAngle - this.facingAngle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                this.facingAngle += diff * Math.min(1, this.turnSpeed * dt);
            }

            moveForward(dt) {
                this.position.x += Math.sin(this.facingAngle) * this.speed * dt;
                this.position.z += Math.cos(this.facingAngle) * this.speed * dt;
            }

            moveToward(target, dt) {
                const dx = target.x - this.position.x;
                const dy = target.y - this.position.y;
                const dz = target.z - this.position.z;
                const flatDist = Math.sqrt(dx * dx + dz * dz);
                if (flatDist < 0.2 && Math.abs(dy) < 0.2) return true;

                // Always face the horizontal target
                this.faceTarget(target, dt);

                // Move forward
                const step = this.speed * dt;
                if (flatDist > 0.2) {
                    this.position.x += Math.sin(this.facingAngle) * step;
                    this.position.z += Math.cos(this.facingAngle) * step;
                }
                // Climb vertically if needed
                if (Math.abs(dy) > 0.1) {
                    this.position.y += Math.sign(dy) * Math.min(Math.abs(dy), step);
                }
                return false;
            }

            update(dt, t, isPlaying) {
                // Dance bounce on beats
                const beatBounce = isPlaying ? Math.abs(Math.sin(t * Math.PI * 4 + this.bobOffset)) * 0.2 : 0;

                // Stuck detection: if we haven't moved much for a while, reset to work
                const moved = this.position.distanceTo(this.lastPos);
                if (moved < 0.02) {
                    this.stuckTime += dt;
                } else {
                    this.stuckTime = 0;
                    this.lastPos.copy(this.position);
                }
                if (this.stuckTime > 5.0) {
                    this.resetToWork();
                    this.stuckTime = 0;
                }

                switch (this.state) {
                    case 'wander': {
                        if (this.moveToward(this.target, dt)) {
                            this.chooseNextActivity(t);
                        }
                        break;
                    }
                    case 'dig': {
                        this.dig(dt, t);
                        break;
                    }
                    case 'fetch_ladder': {
                        const stash = new THREE.Vector3(LADDER_STASH.x, -0.7, LADDER_STASH.z);
                        if (this.moveToward(stash, dt)) {
                            if (this.ladderToPlace && !this.ladderToPlace.carriedBy && !this.ladderToPlace.placed) {
                                this.ladderToPlace.carriedBy = this;
                                this.ladderToPlace.group.visible = true;
                            }
                            this.setState('carry_ladder', 12);
                        }
                        break;
                    }
                    case 'carry_ladder': {
                        if (!this.ladderToPlace || !this.ladderToPlace.group.visible) {
                            this.setState('wander', 3);
                            break;
                        }
                        this.target.set(this.ladderTargetX, -0.7, this.ladderTargetZ);
                        if (this.moveToward(this.target, dt)) {
                            this.setState('place_ladder', 2);
                        }
                        break;
                    }
                    case 'place_ladder': {
                        if (this.ladderToPlace) {
                            this.ladderToPlace.x = this.ladderTargetX;
                            this.ladderToPlace.z = this.ladderTargetZ;
                            this.ladderToPlace.group.position.set(this.ladderTargetX, 0, this.ladderTargetZ);
                            this.ladderToPlace.group.rotation.set(0, 0, 0);
                            this.ladderToPlace.placed = true;
                            this.ladderToPlace.carriedBy = null;
                            this.ladderToPlace.group.visible = true;
                            this.ladder = this.ladderToPlace;
                            this.ladderToPlace = null;
                        }
                        this.setState('goto_ladder', 8);
                        break;
                    }
                    case 'goto_ladder': {
                        if (this.ladder) {
                            const base = new THREE.Vector3(this.ladder.x, -0.7, this.ladder.z);
                            if (this.moveToward(base, dt)) {
                                this.setState('climb_up', 4);
                            }
                        } else {
                            this.setState('wander', 3);
                        }
                        break;
                    }
                    case 'climb_up': {
                        if (!this.ladder) { this.setState('wander', 3); break; }
                        if (this.stateTimer <= 0) {
                            this.position.y = WOMBAT_MAX_Y;
                            this.setState('grab_tile', 2);
                            break;
                        }
                        // Rise straight up while aligning to ladder
                        const climbSpeed = 4.0;
                        this.position.y += climbSpeed * dt;
                        this.position.x += (this.ladder.x - this.position.x) * 0.1;
                        this.position.z += (this.ladder.z - this.position.z) * 0.1;
                        this.faceTarget(new THREE.Vector3(this.ladder.x, WOMBAT_MAX_Y, this.ladder.z), dt);
                        if (this.position.y >= WOMBAT_MAX_Y - 0.1) {
                            this.position.y = WOMBAT_MAX_Y;
                            this.setState('grab_tile', 2);
                        }
                        break;
                    }
                    case 'grab_tile': {
                        if (!this.carrying) {
                            this.carrying = this.targetTile;
                            if (this.carrying) {
                                this.carrying.userData.state = 'carried';
                                this.carrying.userData.carrier = this;
                            }
                        }
                        // Stay at top of ladder while grabbing
                        this.position.x += (this.ladder.x - this.position.x) * 0.1;
                        this.position.z += (this.ladder.z - this.position.z) * 0.1;
                        this.position.y = WOMBAT_MAX_Y;
                        if (this.stateTimer <= 0) {
                            this.setState('climb_down', 6);
                        }
                        break;
                    }
                    case 'climb_down': {
                        if (!this.ladder) { this.setState('wander', 3); break; }
                        if (this.stateTimer <= 0 || this.position.y <= WOMBAT_MIN_Y + 0.1) {
                            this.position.y = WOMBAT_MIN_Y;
                            this.pickBurrowTarget();
                            this.setState('return', 10);
                            break;
                        }
                        // Descend straight down while aligning to ladder
                        const descendSpeed = 4.0;
                        this.position.y -= descendSpeed * dt;
                        this.position.x += (this.ladder.x - this.position.x) * 0.1;
                        this.position.z += (this.ladder.z - this.position.z) * 0.1;
                        this.faceTarget(new THREE.Vector3(this.ladder.x, WOMBAT_MIN_Y, this.ladder.z), dt);
                        if (this.position.y <= WOMBAT_MIN_Y + 0.1) {
                            this.position.y = WOMBAT_MIN_Y;
                            this.pickBurrowTarget();
                            this.setState('return', 10);
                        }
                        break;
                    }
                    case 'steal_floor': {
                        if (!this.carrying || !this.carrying.parent) {
                            this.ensureHomeBurrow();
                            this.carrying = this.nearestHomeTile(false);
                            if (!this.carrying) { this.setState('wander', 3); break; }
                            this.carrying.userData.state = 'carried';
                            this.carrying.userData.carrier = this;
                        }
                        const targetPos = this.carrying.position.clone();
                        targetPos.y = -0.7;
                        if (this.moveToward(targetPos, dt)) {
                            this.ensureHomeBurrow();
                            this.pickBurrowTarget();
                            this.setState('return', 10);
                        }
                        break;
                    }
                    case 'return': {
                        if (!this.carrying || !this.carrying.parent) {
                            this.setState('wander', 3);
                            break;
                        }
                        if (this.moveToward(this.target, dt)) {
                            this.setState('drop', 1.5);
                        }
                        break;
                    }
                    case 'drop': {
                        this.dropTile();
                        this.chooseNextActivity(t);
                        break;
                    }
                    case 'dance': {
                        this.dancePhase += dt * 10;
                        if (this.stateTimer <= 0) {
                            this.chooseNextActivity(t);
                        }
                        break;
                    }
                }

                // Clamp Y to floor/ladder range first
                let baseY = Math.max(WOMBAT_MIN_Y, Math.min(WOMBAT_MAX_Y, this.position.y));
                // Only add bounce/dance when on the ground; otherwise it fights descent/climb
                const onGround = baseY <= WOMBAT_MIN_Y + 0.1;
                const danceY = (onGround && this.state === 'dance') ? Math.sin(this.dancePhase) * 0.5 : 0;
                const bounce = onGround ? beatBounce : 0;
                this.position.y = Math.max(WOMBAT_MIN_Y, Math.min(WOMBAT_MAX_Y, baseY + bounce + danceY));

                // Clamp horizontal position so wombats stay in the visible world
                const horizontalRadius = Math.sqrt(this.position.x * this.position.x + this.position.z * this.position.z);
                if (horizontalRadius > WORLD_RADIUS + 4) {
                    const clampScale = (WORLD_RADIUS + 4) / horizontalRadius;
                    this.position.x *= clampScale;
                    this.position.z *= clampScale;
                    // If we were wandering outside, pick a new in-bounds target
                    if (this.state === 'wander') this.pickNewTarget();
                }

                // Update mesh rotation: nose-first
                this.mesh.rotation.z = this.facingAngle + WOMBAT_ROTATION_OFFSET;

                // Carried ladder (horizontal, in front)
                if (this.ladderToPlace && this.ladderToPlace.group.visible) {
                    const forward = new THREE.Vector3(Math.sin(this.facingAngle), 0, Math.cos(this.facingAngle));
                    const carryPos = this.position.clone().add(forward.multiplyScalar(2.0)).add(new THREE.Vector3(0, 0.4, 0));
                    this.ladderToPlace.group.position.copy(carryPos);
                    // Ladder lies horizontally, pointing forward
                    this.ladderToPlace.group.rotation.set(0, -this.facingAngle, Math.PI / 2);
                }

                // Carried tile sticks out front horizontally like it's in the mouth
                if (this.carrying && this.carrying.parent) {
                    const forward = new THREE.Vector3(Math.sin(this.facingAngle), 0, Math.cos(this.facingAngle));
                    const mouthPos = this.position.clone().add(forward.multiplyScalar(1.6)).add(new THREE.Vector3(0, 0.2, 0));
                    this.carrying.position.copy(mouthPos);
                    this.carrying.rotation.set(0, -this.facingAngle, 0);
                    this.carrying.userData.current.copy(mouthPos);
                }

                this.stateTimer -= dt;
            }

            chooseNextActivity(t) {
                // Goal: keep stealing cubes and filling burrows. Never idle at the edge.

                // Make sure we have a usable burrow
                let openBurrow = burrows.find(b => b.dug && !b.isFull());
                if (!openBurrow && burrows.length < 6) {
                    // Dig a new burrow near the center
                    const angle = (this.idx * 1.5) + (Math.random() * 0.8);
                    const radius = 4 + (this.idx % 3) * 2.0;
                    this.digSpot = { x: Math.cos(angle) * Math.min(radius, 8), z: Math.sin(angle) * Math.min(radius, 8) };
                    this.target.set(this.digSpot.x, -0.7, this.digSpot.z);
                    this.setState('dig', 4);
                    return;
                }
                if (openBurrow) {
                    this.homeBurrow = openBurrow;
                    this.burrow = openBurrow;
                } else if (this.homeBurrow && this.homeBurrow.isFull()) {
                    // All burrows full — celebrate near the center
                    this.setState('dance', 2 + Math.random() * 2);
                    return;
                }
                this.burrow = this.homeBurrow;

                // Try high letters first (more interesting), then floor letters
                const highTile = this.nearestHomeTile(true);
                if (highTile) {
                    this.targetTile = highTile;
                    const placedLadder = nearestLadderToTile(highTile);
                    if (!placedLadder) {
                        const need = findUnplacedLadderNeed();
                        if (need) {
                            this.ladderToPlace = need;
                            this.ladderTargetX = highTile.userData.home.x;
                            this.ladderTargetZ = 2.5;
                            this.setState('fetch_ladder', 12);
                            return;
                        }
                    } else {
                        this.ladder = placedLadder;
                        this.setState('goto_ladder', 8);
                        return;
                    }
                }

                const floorTile = this.nearestHomeTile(false);
                if (floorTile) {
                    this.targetTile = floorTile;
                    this.setState('steal_floor', 8);
                    return;
                }

                // Nothing left to steal — celebrate near the center
                if (Math.random() < 0.7 && t > 0) {
                    this.setState('dance', 1.5 + Math.random() * 1.5);
                } else {
                    this.pickNewTarget();
                    this.setState('wander', 2 + Math.random() * 2);
                }
            }

            ensureHomeBurrow() {
                if (this.homeBurrow && !this.homeBurrow.isFull()) return;
                const existing = burrows.find(b => b.dug && !b.isFull());
                if (existing) {
                    this.homeBurrow = existing;
                    this.burrow = existing;
                    return;
                }
                const undug = burrows.find(b => !b.dug);
                if (undug) {
                    undug.dug = true;
                    undug.opening = 0;
                    this.homeBurrow = undug;
                    this.burrow = undug;
                }
            }

            pickBurrowTarget() {
                const b = this.burrow || this.homeBurrow;
                if (!b) {
                    // No burrow yet — head toward center and dig one rather than wandering to the edge
                    this.target.set(0, -0.7, 0);
                    return;
                }
                this.target.set(b.x + (Math.random() - 0.5) * 1.2, -0.7, b.z + (Math.random() - 0.5) * 1.2);
            }

            dig(dt, t) {
                if (this.digSpot) {
                    const spot = new THREE.Vector3(this.digSpot.x, -0.7, this.digSpot.z);
                    if (this.moveToward(spot, dt)) {
                        // Dig animation
                        this.position.y = -0.7 + Math.abs(Math.sin(t * 15)) * 0.4;
                        this.mesh.rotation.z += Math.sin(t * 20) * 0.1;
                        if (this.stateTimer <= 2.0 && this.digSpot) {
                            const b = makeBurrow(this.digSpot.x, this.digSpot.z, burrows.length);
                            b.dug = true;
                            b.opening = 0;
                            this.homeBurrow = b;
                            this.burrow = b;
                            this.digSpot = null;
                        }
                    }
                } else {
                    this.setState('wander', 3);
                }
            }

            dropTile() {
                if (!this.carrying || !this.carrying.parent) return;
                const b = this.burrow || this.homeBurrow;
                if (b && !b.isFull()) {
                    b.stored.push(this.carrying);
                    this.carrying.userData.state = 'stored';
                    this.carrying.userData.storedIn = b;
                    this.carrying.userData.carrier = null;
                    // Stack cubes inside the burrow cylinder from the bottom up
                    const cubeSize = 2.0;
                    const floor = -1.0 - b.depth + cubeSize / 2;
                    const index = b.stored.length - 1;
                    const y = floor + index * (cubeSize * 0.9);
                    const angle = index * 0.7;
                    const r = 0.4 + Math.random() * 0.4;
                    this.carrying.position.set(
                        b.x + Math.cos(angle) * r,
                        y,
                        b.z + Math.sin(angle) * r
                    );
                    this.carrying.rotation.set(Math.PI / 2, angle, 0);
                }
                this.carrying = null;
            }
        }

        const wombats = [];
        const wombatColors = [0x5d4037, 0x795548, 0x4e342e, 0x6d4c41];

        // Load the real wombat STL and spawn the troupe
        const loader = new THREE.STLLoader();
        loader.load('models/wombat.stl', function(geometry) {
            geometry.computeBoundingBox();
            const center = new THREE.Vector3();
            geometry.boundingBox.getCenter(center);
            geometry.translate(-center.x, -center.y, -center.z);

            const size = new THREE.Vector3();
            geometry.boundingBox.getSize(size);
            const maxDim = Math.max(size.x, size.y, size.z);
            const baseScale = 3.0 / maxDim;

            for (let i = 0; i < 4; i++) {
                const angle = (i / 4) * Math.PI * 2;
                const w = new Wombat(scene.root, geometry, baseScale, wombatColors[i], i);
                w.position.set(Math.cos(angle) * 10, -0.7, Math.sin(angle) * 10);
                w.facingAngle = angle;
                w.pickNewTarget();
                wombats.push(w);
            }
        }, undefined, function(err) {
            console.error('Failed to load wombat STL', err);
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('overlay').style.display = 'block';

        const playBtn = document.getElementById('playBtn');
        const seekBar = document.getElementById('seekBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const beatMarker = document.getElementById('beatMarker');
        const beatFlash = document.getElementById('beatFlash');

        playBtn.addEventListener('click', () => {
            analyzer.enable();
            if (player.isPlaying) {
                player.pause();
                sfPlayer.pause();
                playBtn.textContent = '▶ Play';
            } else {
                player.play().then(() => {
                    sfPlayer.play();
                    playBtn.textContent = '⏸ Pause';
                }).catch(err => {
                    console.error('Playback failed', err);
                });
            }
        });

        seekBar.addEventListener('input', () => {
            const t = parseFloat(seekBar.value);
            player.seek(t);
            sfPlayer.seek(t);
            nextBeatIndex = 0;
        });

        player.on('pause', () => { playBtn.textContent = '▶ Play'; })
              .on('play', () => { playBtn.textContent = '⏸ Pause'; })
              .on('ended', () => { playBtn.textContent = 'Replay'; });

        function updateLetters(t) {
            const elapsed = Math.max(0, t);
            letters.forEach((letter) => {
                if (letter.userData.state === 'carried' || letter.userData.state === 'stored') return;
                const home = letter.userData.home;
                const idx = letter.userData.idx;
                const phase = letter.userData.phase;

                let targetY = home.y + Math.sin(t * 2 + phase) * 0.15;
                let targetZ = home.z;
                let targetX = home.x;
                let rotY = 0;
                let rotX = Math.sin(t + phase) * 0.05;
                let scale = 1;

                if (elapsed > 0 && elapsed < 6.0) {
                    if (elapsed < 2.0) {
                        const spinStart = idx * 0.06;
                        const spinProgress = Math.min(1, Math.max(0, (elapsed - spinStart) / 0.5));
                        if (spinProgress > 0) {
                            rotY = spinProgress * Math.PI * 2;
                            scale = 1 + Math.sin(spinProgress * Math.PI) * 0.2;
                        }
                    } else if (elapsed < 4.0) {
                        const p = (elapsed - 2.0) / 2.0;
                        const angle = (idx / letters.length) * Math.PI * 2 + t;
                        const radius = 6 * Math.sin(p * Math.PI);
                        targetY = home.y + Math.sin(angle) * radius * 0.4;
                        targetZ = home.z + Math.cos(angle) * radius;
                        rotY = p * Math.PI * 4;
                        rotX = p * Math.PI * 2;
                    } else {
                        const p = (elapsed - 4.0) / 2.0;
                        const angle = (idx / letters.length) * Math.PI * 2 + 4;
                        const radius = 6 * Math.sin((1 - p) * Math.PI / 2);
                        targetY = home.y + Math.sin(angle) * radius * 0.4;
                        targetZ = home.z + Math.cos(angle) * radius;
                        rotY = (1 - p) * Math.PI * 4;
                    }
                }

                letter.userData.current.set(targetX, targetY, targetZ);
                letter.position.copy(letter.userData.current);
                letter.rotation.x = rotX;
                letter.rotation.y = rotY;
                letter.scale.setScalar(scale);
            });
        }

        function updateBurrows(dt) {
            burrows.forEach(b => {
                if (typeof b.opening === 'number') {
                    b.opening += dt * 3;
                    const s = Math.min(1, b.opening);
                    b.rim.scale.set(s, s, s);
                    b.mound.scale.set(s, s, s);
                    if (s >= 1) b.opening = null;
                }
            });
        }

        function resetConfetti(c) {
            c.visible = true;
            c.position.set(
                (Math.random() - 0.5) * 50,
                12 + Math.random() * 8,
                (Math.random() - 0.5) * 25 - 5
            );
            c.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            c.userData.state = 'falling';
            c.userData.velocity.set(
                (Math.random() - 0.5) * 0.5,
                -(0.5 + Math.random() * 1.5),
                (Math.random() - 0.5) * 0.5
            );
            c.userData.rotSpeed = (Math.random() - 0.5) * 0.2;
            c.userData.wobble = Math.random() * Math.PI * 2;
            c.userData.settleOffset = Math.random() * 0.2;
        }

        function updateConfetti(dt, t) {
            // Keep a healthy number of particles
            while (confetti.length < 180) {
                spawnConfetti();
            }

            // Count falling particles; if too few, recycle settled ones
            let fallingCount = 0;
            confetti.forEach(c => {
                if (c.userData.state === 'falling') fallingCount++;
            });
            if (fallingCount < 80) {
                const settled = confetti.filter(c => c.userData.state === 'settled');
                // Recycle the ones that have been settled longest
                settled.sort((a, b) => (b.userData.settledTime || 0) - (a.userData.settledTime || 0));
                for (let i = 0; i < Math.min(10, settled.length); i++) {
                    resetConfetti(settled[i]);
                }
            }

            confetti.forEach(c => {
                const d = c.userData;
                if (d.state === 'settled') {
                    d.settledTime = (d.settledTime || 0) + dt;
                } else {
                    d.settledTime = 0;
                }

                if (d.state === 'falling') {
                    d.velocity.y -= 9.8 * dt * 0.3;
                    c.position.addScaledVector(d.velocity, dt);
                    c.rotation.x += d.rotSpeed;
                    c.rotation.y += d.rotSpeed * 1.3;
                    c.position.x += Math.sin(t + d.wobble) * 0.01;
                    if (c.position.y <= FLOOR_Y + d.settleOffset) {
                        c.position.y = FLOOR_Y + d.settleOffset;
                        d.state = 'settled';
                        d.velocity.set(0, 0, 0);
                    }
                } else {
                    // Plow by wombats
                    let pushed = false;
                    for (const w of wombats) {
                        const dx = c.position.x - w.position.x;
                        const dz = c.position.z - w.position.z;
                        const distSq = dx * dx + dz * dz;
                        if (distSq < 5.0) {
                            const dist = Math.sqrt(distSq) || 0.01;
                            const force = (5.0 - distSq) / 5.0;
                            const fx = Math.sin(w.facingAngle);
                            const fz = Math.cos(w.facingAngle);
                            d.velocity.x += fx * force * 6 + (dx / dist) * force * 2;
                            d.velocity.z += fz * force * 6 + (dz / dist) * force * 2;
                            d.velocity.y += force * 4;
                            pushed = true;
                        }
                    }
                    // Suck toward nearest burrow if close
                    if (!pushed && d.state === 'settled') {
                        let nearestB = null;
                        let nearestD = Infinity;
                        burrows.forEach(b => {
                            const dx = c.position.x - b.x;
                            const dz = c.position.z - b.z;
                            const dd = dx * dx + dz * dz;
                            if (dd < nearestD) { nearestD = dd; nearestB = b; }
                        });
                        if (nearestB && nearestD < 4.0) {
                            const dist = Math.sqrt(nearestD) || 0.01;
                            const force = (4.0 - nearestD) / 4.0;
                            d.velocity.x -= ((c.position.x - nearestB.x) / dist) * force * 2;
                            d.velocity.z -= ((c.position.z - nearestB.z) / dist) * force * 2;
                            d.velocity.y -= force * 2;
                            if (dist < 1.2) {
                                d.state = 'sinking';
                            } else {
                                d.state = 'drifting';
                            }
                        }
                    }
                    if (pushed) d.state = 'drifting';

                    if (d.state === 'drifting' || d.state === 'sinking') {
                        d.velocity.y -= 9.8 * dt * 0.3;
                        c.position.addScaledVector(d.velocity, dt);
                        c.rotation.x += d.rotSpeed * 2;
                        c.rotation.y += d.rotSpeed * 2.6;
                        d.velocity.multiplyScalar(0.96);
                        if (d.state === 'sinking' && c.position.y < -8.5) {
                            // Recycle instead of removing
                            resetConfetti(c);
                        } else if (c.position.y <= FLOOR_Y + d.settleOffset) {
                            c.position.y = FLOOR_Y + d.settleOffset;
                            d.state = 'settled';
                            d.velocity.set(0, 0, 0);
                        }
                    }
                }

                // Recycle confetti that fell out of view
                if (c.position.y < -12) {
                    resetConfetti(c);
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = player.currentTime;
            const dur = player.duration || 44;
            const wallTime = clock.now();
            const rawDt = wallTime - lastFrameTime;
            lastFrameTime = wallTime;
            const dt = Math.min(0.05, rawDt || 1 / 60);
            const isPlaying = player.isPlaying;

            // Schedule soundfont notes ahead of current time
            sfPlayer.schedule();

            // Seek bar
            seekBar.max = dur;
            if (!seekBar.matches(':active')) seekBar.value = t;
            timeDisplay.textContent = `${formatTime(t)} / ${formatTime(dur)}`;
            beatMarker.style.left = `${(t / dur) * 100}%`;

            // Beat rings on authored beat times
            while (nextBeatIndex < beatTimes.length && beatTimes[nextBeatIndex] <= t) {
                if (wombats.length) {
                    const w = wombats[nextBeatIndex % wombats.length];
                    spawnBeatRing(w.position.x, w.position.z, 0xffd700);
                } else {
                    spawnBeatRing(0, 0, 0xffd700);
                }
                beatFlash.style.opacity = 0.4;
                setTimeout(() => { beatFlash.style.opacity = 0; }, 80);
                nextBeatIndex++;
            }

            // Update beat rings
            for (let i = beatRings.length - 1; i >= 0; i--) {
                const br = beatRings[i];
                const age = t - br.birth;
                const s = 1 + age * 8;
                br.mesh.scale.set(s, s, s);
                br.mesh.material.opacity = Math.max(0, 0.85 - age * 1.2);
                if (br.mesh.material.opacity <= 0.01) {
                    br.mesh.visible = false;
                    ringPool.push(br);
                    beatRings.splice(i, 1);
                }
            }

            // Sound bars
            if (analyzer.analyser && analyzer.dataArray) {
                analyzer.analyser.getByteFrequencyData(analyzer.dataArray);
                const step = Math.floor(analyzer.dataArray.length / soundBars.length);
                for (let i = 0; i < soundBars.length; i++) {
                    const value = analyzer.dataArray[i * step] / 255;
                    const h = 1 + value * 12;
                    soundBars[i].scale.y = h;
                    soundBars[i].position.y = -2 + h / 2;
                    soundBars[i].material.opacity = 0.3 + value * 0.7;
                }
            }

            // Letter animation (home tiles only)
            updateLetters(t);

            // Wombats — freeze when music is paused
            if (isPlaying) {
                wombats.forEach((w, i) => w.update(dt, t, isPlaying));
            }

            updateBurrows(dt);
            updateConfetti(dt, t);

            // Ring pulse
            const pulse = 1 + Math.sin(wallTime * 3) * 0.08;
            ring.scale.set(pulse, pulse, pulse);

            // Camera drift — pulled back and lowered so the bottom row ('HARRY') stays readable
            scene.camera.position.x = Math.sin(wallTime * 0.12) * 2;
            scene.camera.position.y = 5 + Math.cos(wallTime * 0.08) * 0.5;
            scene.camera.position.z = 34;
            scene.camera.lookAt(0, 2, 0);

            scene.render();
        }
        animate();
        } catch (e) {
            showFatal('Demo failed to start: ' + e.message, isWebGLError(e.message));
        }
    })();
    </script>
</body>
</html>
